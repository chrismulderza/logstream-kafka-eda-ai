# Parallel SIEM consumer for Elasticsearch/Logstash.
# group_id must be siem-logstash — never ansible-eda or stream-worker.
input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP:telemetry-kafka-plain-bootstrap.logstream-kafka.svc:9092}"
    topics => ["rhel-system-logs", "rhel-pcp-metrics", "enriched-events"]
    group_id => "siem-logstash"
    codec => json
    consumer_threads => 3
    auto_offset_reset => "latest"
  }
}

filter {
  mutate {
    add_field => { "[@metadata][index_suffix]" => "%{[@metadata][kafka][topic]}" }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:https://elasticsearch.example.com:9200}"]
    index => "logstream-%{[@metadata][index_suffix]}-%{+YYYY.MM.dd}"
  }
}
