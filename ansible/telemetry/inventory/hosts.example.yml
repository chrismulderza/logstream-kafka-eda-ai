---
# Copy to inventory/hosts.yml and replace hostnames, SSH user, and ansible_host.
# Target group name is required: rhel_telemetry
#
#   cp inventory/hosts.example.yml inventory/hosts.yml

all:
  children:
    rhel_telemetry:
      hosts:
        rhel-app-01:
          ansible_host: 192.0.2.11
          ansible_user: ansible
        rhel-app-02:
          ansible_host: 192.0.2.12
          ansible_user: ansible
      vars:
        ansible_become: true
