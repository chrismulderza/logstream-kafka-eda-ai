---
- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart pcp2kafka
  ansible.builtin.systemd:
    name: pcp2kafka
    state: restarted
    daemon_reload: true

- name: Update CA trust
  ansible.builtin.command:
    cmd: update-ca-trust extract
  changed_when: true

- name: Restore CA file context
  ansible.builtin.command:
    cmd: restorecon -v {{ kafka_ca_path }}
  changed_when: true
