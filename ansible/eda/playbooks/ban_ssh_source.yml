---
# Ban a source IP after failed SSH. Firewall change is gated.
# Parses "from <ip>" in typical sshd Failed password lines.

- name: Ban SSH source address
  hosts: "{{ target_host | default('rhel_telemetry') }}"
  become: true
  gather_facts: false
  vars:
    allow_firewall_ban: false
    syslog_message: ""
    ban_firewall_backend: firewalld
  tasks:
    - name: Extract source IPv4 from syslog
      ansible.builtin.set_fact:
        ssh_source_ip: "{{ syslog_message | regex_search('from ([0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') }}"

    - name: Show SSH failure without changing firewall
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          source_ip: "{{ ssh_source_ip | default('unparsed') }}"
          gated: "{{ not (allow_firewall_ban | bool) }}"
          message: "{{ syslog_message }}"

    - name: Refuse ban without a parsed IPv4
      ansible.builtin.assert:
        that:
          - ssh_source_ip | default('') | length > 0
        fail_msg: Could not parse a source IPv4 from the syslog line; no firewall change.
      when: allow_firewall_ban | bool

    - name: Drop source in firewalld (opt-in)
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --permanent
          - --add-rich-rule=rule family=ipv4 source address={{ ssh_source_ip }} drop
      when:
        - allow_firewall_ban | bool
        - ban_firewall_backend == "firewalld"
        - ssh_source_ip | default('') | length > 0

    - name: Reload firewalld after rich rule (opt-in)
      ansible.builtin.command:
        argv: [firewall-cmd, --reload]
      when:
        - allow_firewall_ban | bool
        - ban_firewall_backend == "firewalld"
        - ssh_source_ip | default('') | length > 0

    - name: Drop source in nftables (opt-in)
      ansible.builtin.command:
        argv:
          - nft
          - add
          - rule
          - inet
          - filter
          - input
          - ip
          - saddr
          - "{{ ssh_source_ip }}"
          - drop
      when:
        - allow_firewall_ban | bool
        - ban_firewall_backend == "nftables"
        - ssh_source_ip | default('') | length > 0
