# ServiceAccount for the predictive AI stream worker.
# OpenShift restricted-v2: this SA does not need any SCC grant beyond the
# namespace default (restricted-v2). Do not assign privileged or anyuid.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: predictive-ai-worker
  namespace: logstream-kafka
  labels:
    app.kubernetes.io/name: predictive-ai-worker
    app.kubernetes.io/part-of: logstream-kafka
    app.kubernetes.io/component: stream-worker
