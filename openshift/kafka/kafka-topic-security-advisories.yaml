apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: security-advisories
  namespace: logstream-kafka
  labels:
    strimzi.io/cluster: telemetry
spec:
  partitions: 3
  replicas: 3
  config:
    # 7 days. Promote and change approval are human-paced.
    retention.ms: "604800000"
    min.insync.replicas: "2"
