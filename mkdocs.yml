site_name: Logstream Kafka EDA
site_description: Administrator deployment book for Kafka, RHEL syslog analysis with Event-Driven Ansible, and optional predictive analytics
site_url: https://chrismulderza.github.io/logstream-kafka-eda-ai/
repo_url: https://github.com/chrismulderza/logstream-kafka-eda-ai
repo_name: chrismulderza/logstream-kafka-eda-ai
edit_uri: edit/main/docs/
docs_dir: docs
hooks:
  - hooks/repo_file_links.py
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/openshift.png
  favicon: assets/images/openshift.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
extra_css:
  - assets/stylesheets/extra.css
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - mdx_truly_sane_lists
validation:
  links:
    absolute_links: ignore
    unrecognized_links: ignore
    not_found: info
nav:
  - Overview:
      - Introduction: overview/introduction.md
      - Architecture: overview/architecture.md
      - Prerequisites: overview/prerequisites.md
  - Deployment:
      - Kafka on OpenShift: deployment/kafka-openshift.md
      - RHEL telemetry: deployment/rhel-telemetry.md
      - Event-Driven Ansible: deployment/event-driven-ansible.md
  - Validation:
      - Runbook: validation/runbook.md
  - Optional:
      - Predictive worker: optional/predictive-ai-worker.md
      - SIEM and dashboards: optional/siem-dashboards.md
