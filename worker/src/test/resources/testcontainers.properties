# Testcontainers / Quarkus Dev Services: Podman only on developer workstations.
# Runtime socket + Ryuk are also set by worker/scripts/podman-env.sh (mise run *).
ryuk.disabled=true
# Prefer DOCKER_HOST from podman-env.sh over a stale ~/.testcontainers.properties strategy.
docker.client.strategy=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy
