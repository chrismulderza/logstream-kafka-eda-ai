# HTTP (OpenShift probes on 8080)
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Health paths compatible with deployment liveness/readiness probes
quarkus.smallrye-health.root-path=/
quarkus.smallrye-health.liveness-path=healthz
quarkus.smallrye-health.readiness-path=readyz
quarkus.smallrye-health.startup-path=started

# Logging
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.category."ai.logstream.worker".level=${LOG_LEVEL:INFO}

# Kafka bootstrap is NOT set here on purpose:
# - quarkus:dev / %test → Dev Services injects kafka.bootstrap.servers
# - OpenShift → ConfigMap/env KAFKA_BOOTSTRAP_SERVERS maps to kafka.bootstrap.servers
# Setting kafka.bootstrap.servers disables Dev Services. To use an external broker
# in dev, export KAFKA_BOOTSTRAP_SERVERS before ./mvnw quarkus:dev.

# Incoming metrics channel (multi-topic)
mp.messaging.incoming.metrics.connector=smallrye-kafka
mp.messaging.incoming.metrics.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.incoming.metrics.topics=${KAFKA_CONSUME_TOPICS:rhel-pcp-metrics,raw-metrics}
mp.messaging.incoming.metrics.group.id=${KAFKA_CONSUMER_GROUP:stream-worker}
mp.messaging.incoming.metrics.client.id=${KAFKA_CLIENT_ID:predictive-ai-worker}
mp.messaging.incoming.metrics.auto.offset.reset=${KAFKA_AUTO_OFFSET_RESET:latest}
mp.messaging.incoming.metrics.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
mp.messaging.incoming.metrics.enable.auto.commit=true
mp.messaging.incoming.metrics.failure-strategy=ignore
mp.messaging.incoming.metrics.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.metrics.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Outgoing enriched-events channel
mp.messaging.outgoing.enriched.connector=smallrye-kafka
mp.messaging.outgoing.enriched.bootstrap.servers=${kafka.bootstrap.servers}
mp.messaging.outgoing.enriched.topic=${KAFKA_PRODUCE_TOPIC:enriched-events}
mp.messaging.outgoing.enriched.client.id=${KAFKA_CLIENT_ID:predictive-ai-worker}-producer
mp.messaging.outgoing.enriched.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
mp.messaging.outgoing.enriched.acks=all
mp.messaging.outgoing.enriched.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.enriched.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# Worker tuning (env vars match openshift/worker/configmap.yaml)
worker.window-seconds=${WINDOW_SECONDS:900}
worker.min-samples=${MIN_SAMPLES:4}
worker.tte-alert-threshold-seconds=${TTE_ALERT_THRESHOLD_SECONDS:3600}
worker.alert-cooldown-seconds=${ALERT_COOLDOWN_SECONDS:300}
worker.classify-logs=${CLASSIFY_LOGS:false}
worker.llm-on-metric-alerts=${LLM_ON_METRIC_ALERTS:true}
# Inference is optional (Optional<String> on base-url / api-key). Prefer leaving
# INFERENCE_BASE_URL unset rather than ""; empty env from OpenShift ConfigMap is
# OK with Optional. Also accepts WORKER_INFERENCE_BASE_URL / WORKER_INFERENCE_API_KEY.
worker.inference.base-url=${INFERENCE_BASE_URL:}
worker.inference.api-key=${INFERENCE_API_KEY:}
worker.inference.model=${INFERENCE_MODEL:default}
worker.inference.timeout-seconds=${INFERENCE_TIMEOUT_SECONDS:15}
worker.inference.max-tokens=${INFERENCE_MAX_TOKENS:400}

# Dev: start Kafka automatically via Podman (not Docker Desktop).
# Use `mise run dev` (sources scripts/podman-env.sh) so DOCKER_HOST points at the
# Podman API socket and `docker` on PATH is a podman shim. See docs/06 §6.2.2.
%dev.quarkus.kafka.devservices.enabled=true
%dev.quarkus.kafka.devservices.shared=true
%dev.quarkus.kafka.devservices.service-name=kafka
%dev.quarkus.kafka.devservices.topic-partitions."rhel-pcp-metrics"=1
%dev.quarkus.kafka.devservices.topic-partitions."raw-metrics"=1
%dev.quarkus.kafka.devservices.topic-partitions."enriched-events"=1
%dev.quarkus.log.category."ai.logstream.worker".level=DEBUG

# QuarkusTest / continuous testing: same Podman-backed Dev Services Kafka
%test.quarkus.kafka.devservices.enabled=true
%test.quarkus.kafka.devservices.shared=true
%test.quarkus.kafka.devservices.topic-partitions."rhel-pcp-metrics"=1
%test.quarkus.kafka.devservices.topic-partitions."raw-metrics"=1
%test.quarkus.kafka.devservices.topic-partitions."enriched-events"=1
